[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-dub-cli"
version = "0.1.0"
description = "video-dub-cli — single command to dub any video"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
    "tenacity>=8.0.0",
    "loguru>=0.7.0",
]

[project.scripts]
dub = "dub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end CLI workflow tests",
    "timeout: long-running test budget marker",
]