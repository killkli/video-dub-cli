[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-dub-cli"
version = "0.1.0"
description = "video-dub-cli — single command to dub any video"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "video-dub-cli maintainers" },
]
requires-python = ">=3.11,<3.13"
keywords = ["video", "dubbing", "tts", "asr", "translation", "ffmpeg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
]
# Core runtime: CLI shell, config, logging, validation, retry.
# Heavy / optional dependencies live under [project.optional-dependencies].
dependencies = [
    "click>=8.1.7",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.6.0",
    "tenacity>=8.2.3",
    "loguru>=0.7.2",
]

[project.optional-dependencies]
# Translation provider deps (Gemini REST client).
# Note: torchcodec is required at runtime once torchaudio >= 2.9 is installed
# alongside real ASR backend (qwenasr-mlx pulls in torch + torchaudio).
translation = [
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
    "torchcodec>=0.13.0",
]
# TTS / TTS-adjacent deps. The repo now owns the adapter, runner,
# and the minimal vendored OmniVoice inference package under src/omnivoice.
# The heavy model stacks are still split into per-backend optional extras
# so a fresh operator can pull in only what they need. The base [tts]
# extra carries the small dependency-light code (opencc + gradio_client)
# that the VoxCPM route needs in the dub venv. OmniVoice and VoxCPM each
# have their own extra for the heavier weights.
#
# Backend dep map:
#   omnivoice → vendored src/omnivoice package + torch, torchaudio,
#               transformers, accelerate, numpy, pydub, soundfile
#   voxcpme   → gradio_client, opencc (t2s only)
tts = [
    "opencc-python-reimplemented>=0.1.7",
    "gradio_client>=0.16.0",
]
# OmniVoice backend: the model code is vendored in this repo, but the
# runtime still needs the heavy inference deps below. The vendored
# Stage-05 script also imports ``opencc`` directly for zh text
# normalization, so the dedicated OmniVoice interpreter must carry it
# as part of the backend contract.
tts-omnivoice = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "torchcodec>=0.13.0",
    "transformers==5.10.0",
    "accelerate>=1.13.0",
    "numpy>=1.26.0",
    "pydub>=0.25.0",
    "soundfile>=0.12.1",
    "opencc-python-reimplemented>=0.1.7",
]
# VoxCPM backend: gradio_client + opencc for t2s. There is no
# second Python interpreter to worry about — VoxCPM runs as a
# gradio server, and the dub venv just needs the client libs.
tts-vox = [
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
    "torchcodec",
    "transformers>=4.36.2",
    "einops",
    "gradio[mcp]>=6,<7",
    "inflect",
    "addict",
    "wetext",
    "modelscope>=1.22.0",
    "datasets>=3,<4",
    "huggingface-hub",
    "pydantic",
    "tqdm",
    "simplejson",
    "sortedcontainers",
    "soundfile",
    "librosa",
    "matplotlib",
    "funasr",
    "spaces",
    "argbind",
    "safetensors",
    "opencc-python-reimplemented>=0.1.7",
    "gradio_client>=0.16.0",
]

# Stem separation (demucs-mlx). The vocal-remover CLI is vendored under
# src/vocal_remover; this extra pulls in the heavy demucs-mlx inference
# stack for Apple Silicon MLX acceleration.
stems = [
    "demucs-mlx[convert]>=1.4.3",
    "tqdm>=4.66.0",
]

# ASR / audio stack (qwen-asr MLX). Pulls in numpy / torch-free paths.
# torchcodec is the audio I/O shim required by torchaudio >= 2.9.
asr = [
    "soundfile>=0.12.1",
    "typer>=0.16.0",
    "pydantic-settings>=2.10.0",
    "opencc>=1.1.9",
    "qwen3-asr-mlx>=0.1.1",
    "pydub>=0.25.0",
    "silero-vad>=6.0.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "torchcodec>=0.13.0",
]
# Pipeline integration: stage scripts that produce / consume audio.
pipeline = [
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
]
# Development: tests, linters, type checks.
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
]
# All extras combined for the canonical dub venv.
# This intentionally excludes OmniVoice's transformers/accelerate stack,
# because that stack conflicts with qwen3-asr-mlx in the same resolver.
# Operators who want the OmniVoice backend should point
# `paths.omnivoice_python` at a separate interpreter where
# `uv sync --extra tts-omnivoice` has been installed.
all = [
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
    "torchcodec>=0.13.0",
    "opencc-python-reimplemented>=0.1.7",
    "gradio_client>=0.16.0",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "typer>=0.16.0",
    "pydantic-settings>=2.10.0",
    "opencc>=1.1.9",
    "qwen3-asr-mlx>=0.1.1",
    "pydub>=0.25.0",
    "silero-vad>=6.0.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
]

[project.scripts]
dub = "dub.cli:main"
dub-doctor = "dub.doctor:main"
dub-bootstrap = "dub.bootstrap:main"

[project.urls]
"Homepage" = "https://codeberg.org/killkli/video-dub-cli"
"Bug Tracker" = "https://codeberg.org/killkli/video-dub-cli/issues"

[tool.uv]
conflicts = [
    [{ extra = "all" }, { extra = "tts-omnivoice" }],
    [{ extra = "asr" }, { extra = "tts-omnivoice" }],
    [{ extra = "all" }, { extra = "tts-vox" }],
    [{ extra = "asr" }, { extra = "tts-vox" }],
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dub*", "qwenasr_mlx_cli*", "omnivoice*", "voxcpm*", "vocal_remover*"]

[tool.setuptools.package-data]
dub = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: end-to-end CLI workflow tests",
    "timeout: long-running test budget marker",
]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

# UV-first developer/operator contract.
# - Developers sync dev tooling:        `uv sync --extra dev`
# - Operators (dub venv):               `uv sync --extra all`
# - OmniVoice interpreter only:         `uv sync --extra tts-omnivoice`
# - Bare CLI only (for unit tests):     `uv sync`
