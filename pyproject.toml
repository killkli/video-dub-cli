[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-dub-cli"
version = "0.1.0"
description = "video-dub-cli — single command to dub any video"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "video-dub-cli maintainers" },
]
requires-python = ">=3.11"
keywords = ["video", "dubbing", "tts", "asr", "translation", "ffmpeg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
]
# Core runtime: CLI shell, config, logging, validation, retry.
# Heavy / optional dependencies live under [project.optional-dependencies].
dependencies = [
    "click>=8.1.7",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.6.0",
    "tenacity>=8.2.3",
    "loguru>=0.7.2",
]

[project.optional-dependencies]
# Translation provider deps (Gemini REST client).
# Note: torchcodec is required at runtime once torchaudio >= 2.9 is installed
# alongside real ASR backend (qwenasr-mlx pulls in torch + torchaudio).
translation = [
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
    "torchcodec>=0.13.0",
]
# TTS / TTS-adjacent deps. The repo now owns the *adapter* and
# *runner* code paths; the heavy model stacks are split into
# per-backend optional extras so a fresh operator can pull in only
# what they need. The base [tts] extra carries the small
# dependency-light code (opencc + gradio_client) that the VoxCPM
# route needs in the dub venv. OmniVoice and VoxCPM each have
# their own extra for the heavier weights.
#
# Backend dep map:
#   omnivoice → torch, torchaudio (+ the OmniVoice package, which
#               is not on PyPI today; operators clone it to
#               ~/Dev/OmniVoice and the script sys.path.insert's it
#               at runtime — see vendor/pipeline_scripts/dubbing_batch_tts.py)
#   voxcpme   → gradio_client, opencc (t2s only)
tts = [
    "opencc-python-reimplemented>=0.1.7",
    "gradio_client>=0.16.0",
]
# OmniVoice backend: torch + torchaudio. The OmniVoice package
# itself is not pip-installable today; this extra makes sure the
# dub venv has the torch stack OmniVoice needs, and the readiness
# probe for the omnivoice backend verifies torch is importable.
tts-omnivoice = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "torchcodec>=0.13.0",
]
# VoxCPM backend: gradio_client + opencc for t2s. There is no
# second Python interpreter to worry about — VoxCPM runs as a
# gradio server, and the dub venv just needs the client libs.
tts-vox = [
    "gradio_client>=0.16.0",
    "opencc-python-reimplemented>=0.1.7",
]
# Convenience meta-extra: every TTS dep the operator might need.
# Does NOT include torch unless the operator also pulls in
# [tts-omnivoice]; the omnivoice torch stack is large enough to
# deserve its own explicit opt-in.
tts-all = [
    "opencc-python-reimplemented>=0.1.7",
    "gradio_client>=0.16.0",
]
# ASR / audio stack (qwen-asr MLX). Pulls in numpy / torch-free paths.
# torchcodec is the audio I/O shim required by torchaudio >= 2.9.
asr = [
    "soundfile>=0.12.1",
    "typer>=0.16.0",
    "pydantic-settings>=2.10.0",
    "opencc>=1.1.9",
    "qwen3-asr-mlx>=0.1.1",
    "pydub>=0.25.0",
    "silero-vad>=6.0.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "torchcodec>=0.13.0",
]
# Pipeline integration: stage scripts that produce / consume audio.
pipeline = [
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
]
# Development: tests, linters, type checks.
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
]
# All extras combined — convenient for an operator who wants the full
# standalone experience in one `uv sync --extra all` step. Note that
# this does NOT include the OmniVoice torch stack (large download);
# for a fully-repo-contained en→zh pipeline, also pass
# `--extra tts-omnivoice`. VoxCPM's deps are already in the base
# `tts` extra.
all = [
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
    "torchcodec>=0.13.0",
    "opencc-python-reimplemented>=0.1.7",
    "gradio_client>=0.16.0",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "typer>=0.16.0",
    "pydantic-settings>=2.10.0",
    "opencc>=1.1.9",
    "qwen3-asr-mlx>=0.1.1",
    "pydub>=0.25.0",
    "silero-vad>=6.0.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
]

[project.scripts]
dub = "dub.cli:main"
dub-doctor = "dub.doctor:main"
dub-bootstrap = "dub.bootstrap:main"

[project.urls]
"Homepage" = "https://codeberg.org/killkli/video-dub-cli"
"Bug Tracker" = "https://codeberg.org/killkli/video-dub-cli/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dub*", "qwenasr_mlx_cli*"]

[tool.setuptools.package-data]
dub = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: end-to-end CLI workflow tests",
    "timeout: long-running test budget marker",
]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

# UV-first developer/operator contract.
# - Developers sync dev tooling:        `uv sync --extra dev`
# - Operators with all backends:        `uv sync --extra all`
# - Bare CLI only (for unit tests):     `uv sync`
