# Example config: Use an already-translated SRT (skip translation stage)
# Usage: cp config_with_translated_srt.yaml ~/.config/dub/config.yaml, then edit paths
# Then run: dub run video.mp4 --source-lang en --target-lang zh \
#   --translate-mode use-existing --translated-srt /path/to/translated.srt

paths:
  qwenasr_cli: /path/to/qwenasr-mlx
  omnivoice_python: /path/to/omnivoice-python
  skills_dir: /path/to/video-dubbing-pipeline/scripts
  dub_root: ~/.hermes
  translation_skill: /path/to/subtitle_translation.py

defaults:
  source_lang: en
  target_lang: zh
  vocal_gain: 3.0
  inst_gain: -3.0
  keep_fulltrack: false

retry:
  max_attempts: 3
  backoff_seconds: 5
  retry_on:
    - subprocess.CalledProcessError
    - TimeoutError
    - ConnectionError

logging:
  level: INFO
  json_logs: false
  progress: rich

# Example CLI usage with this config:
#   dub run my_talk.mp4 --source-lang en --target-lang zh \
#     --translate-mode use-existing \
#     --translated-srt ~/Downloads/talk.zhtw.srt