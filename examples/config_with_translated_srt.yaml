# Backward-compatible alias of the canonical use-existing example.
# Preferred file: config_use_existing_en2zh.yaml
# Usage: cp config_with_translated_srt.yaml /path/to/config.yaml, then edit paths
# Then run: dub run video.mp4 --source-lang en --target-lang zh \
#   --translate-mode use-existing --translated-srt /path/to/translated.srt

paths:
  qwenasr_cli: /path/to/qwenasr-mlx
  omnivoice_python: /path/to/omnivoice-python
  skills_dir: /path/to/video-dubbing-pipeline/scripts
  dub_root: /path/to/dub-root
  # Legacy compatibility only: standalone CLI translation now uses translation.provider/model below.
  translation_skill: /path/to/subtitle_translation.py

translation:
  provider: gemini
  model: gemini-2.5-flash
  api_env_var: GOOGLE_API_KEY
  temperature: 0.2
  mode: use-existing

defaults:
  source_lang: en
  target_lang: zh
  vocal_gain: 3.0
  inst_gain: -3.0
  keep_fulltrack: false

retry:
  max_attempts: 3
  backoff_seconds: 5
  retry_on:
    - subprocess.CalledProcessError
    - TimeoutError
    - ConnectionError

logging:
  level: INFO
  json_logs: false
  progress: rich

# Example CLI usage with this config:
#   dub run /path/to/input/my_talk.mp4 --source-lang en --target-lang zh \
#     --translate-mode use-existing \
#     --translated-srt /path/to/input/talk.zhtw.srt
