# Canonical Japanese -> Chinese example.
# Standalone contract: defaults are repo-owned or PATH-resolved.
#
# Typical usage (no edits needed):
#   cp examples/config_ja2zh.yaml ~/.config/dub/config.yaml
#   uv run dub run anime.mp4 --source-lang ja --target-lang zh
#
# Override guide — uncomment only the lines you actually need to change.
# For the Japanese route the active TTS adapter is VoxCPM. See
# docs/tts-backend-consolidation.md and `dub doctor --tts` for readiness.

paths:
  # qwenasr_cli: qwenasr-mlx        # default: PATH-resolved "qwenasr-mlx"
  # omnivoice_python: python3       # default: dub venv's python3
  # skills_dir: <repo>/vendor/pipeline_scripts   # default: in-repo vendored scripts
  # tts_engines_dir: null           # default: null (falls back to skills_dir)
  # dub_root: ~/video-dub-cli-runs/ # default: project parent dir
  # translation_skill: <repo>/src/dub/translator_gemini.py   # legacy; not read at runtime

translation:
  provider: gemini
  model: gemini-2.5-flash
  api_env_var: GOOGLE_API_KEY
  temperature: 0.2
  mode: delegate

defaults:
  source_lang: ja
  target_lang: zh
  vocal_gain: 3.0
  inst_gain: -3.0
  keep_fulltrack: false

retry:
  max_attempts: 3
  backoff_seconds: 5
  retry_on:
    - subprocess.CalledProcessError
    - TimeoutError
    - ConnectionError

logging:
  level: INFO
  json_logs: false
  progress: rich
